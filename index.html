<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>השוואת מחירי קניות</title>
  
  <!-- עיצוב -->
  <link rel="stylesheet" href="style.css">

  <!-- הגדרות PWA והתקנה כאפליקציה -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#007bff">

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</head>
<body>

  <!-- חלק עליון: כותרת וסרגל חיפוש -->
  <header>
    <h1>השוואת מחירי קניות</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="חפש מוצר (למשל: חלב, לחם)..." oninput="filterProducts()">
      <span class="search-icon">🔍</span>
    </div>
  </header>

  <main>
    <!-- כפתור צילום / העלאת קבלה -->
    <section class="upload-section">
      <label for="receiptCamera" class="upload-btn">
        📷 צלם / העלה קבלה
      </label>
      <input type="file" id="receiptCamera" accept="image/*" capture="environment" onchange="uploadReceipt(event)">
      <p id="uploadStatus"></p>
    </section>

    <!-- רשימת המוצרים -->
    <section class="products-section">
      <h2>מוצרים שנמצאו</h2>
      <div id="productsList" class="products-list">
        <!-- המוצרים ייטענו לכאן דינמית מ-Google Sheets -->
      </div>
    </section>
  </main>

  <!-- ווידג'ט המלצת הקנייה בתחתית המסך -->
  <footer class="best-store-widget" id="bestStoreWidget">
    <h3>💡 המלצת הקנייה לסל שלך</h3>
    <p id="recommendationText">טוען נתונים...</p>
  </footer>

  <!-- פופאפ (Modal) להצגת מחירי מוצר בחנויות -->
  <div id="priceModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h3 id="modalProductName">שם המוצר</h3>
      <table class="price-table">
        <thead>
          <tr>
            <th>חנות</th>
            <th>מחיר</th>
            <th>תאריך עדכון</th>
          </tr>
        </thead>
        <tbody id="modalPriceTableBody">
          <!-- מחירי חנויות ייטענו לכאן -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
