
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>השוואת מחירי קניות</title>

  <!-- אייקון האתר בלשונית הדפדפן -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2">
  <link rel="shortcut icon" type="image/png" href="/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/icon-192.png?v=2">

  <!-- צבע הדפדפן במכשירים ניידים -->
  <meta name="theme-color" content="#00bfc3">

  <!-- תיאור האתר -->
  <meta name="description" content="השוואת מחירי קניות, פענוח קבלות, מעקב אחרי מחירי מוצרים והשוואת מחירים בין חנויות.">

  <!-- עיצוב האתר -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>השוואת מחירי קניות</h1>

    <!-- סרגל חיפוש -->
    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        onkeyup="filterProducts()"
        placeholder="🔍 חפש מוצר (למשל: חלב, לחם)..."
      >
    </div>

    <!-- כפתורי העלאת קבלה -->
    <div class="action-buttons">

      <label class="btn btn-camera">
        📷 צלם קבלה
        <input
          type="file"
          accept="image/*"
          capture="environment"
          onchange="uploadReceipt(event)"
          hidden
        >
      </label>

      <label class="btn btn-gallery">
        📁 בחר מהגלריה / מסמכים
        <input
          type="file"
          accept="image/*,application/pdf,.pdf"
          onchange="uploadReceipt(event)"
          hidden
        >
      </label>

    </div>

    <!-- הודעות העלאה -->
    <div id="uploadStatus" class="status-msg"></div>

    <!-- סינון לפי מחלקות -->
    <h2>סינון לפי מחלקה</h2>

    <!-- כפתורי המחלקות נוצרים על ידי app.js -->
    <div class="category-bar" id="categoryBar"></div>

    <!-- רשימת מוצרים -->
    <h2>מוצרים שנמצאו</h2>

    <div id="productsList" class="products-grid"></div>

    <!-- המלצת סל -->
    <div id="recommendationBox" class="recommendation-card">
      <p style="color:#64748b;">
        טוען נתוני המלצה...
      </p>
    </div>

  </div>

  <!-- חלון היסטוריית מחירים ועריכת מוצרים -->
  <div id="priceModal" class="modal">

    <div class="modal-content">

      <!-- סגירת חלון -->
      <span
        class="close-btn"
        onclick="closeModal()"
      >&times;</span>

      <h3 id="modalProductName">שם המוצר</h3>

      <!-- טבלת היסטוריית מחירים -->
      <table class="price-table" id="modalTable">

        <thead>
          <tr>
            <th>חנות</th>
            <th>מחיר</th>
            <th>תאריך</th>
            <th>מחלקה</th>
            <th>פעולות</th>
          </tr>
        </thead>

        <tbody id="modalPriceTableBody"></tbody>

      </table>

      <!-- טופס עריכת מוצר -->
      <div
        id="editFormContainer"
        style="
          display:none;
          margin-top:15px;
          background:#f8fafc;
          padding:15px;
          border-radius:10px;
          border:1px solid #e2e8f0;
        "
      >

        <h4 style="margin-bottom:10px;color:#1e293b;">
          ✏️ עריכת פרטי רכישה ומחלקה
        </h4>

        <input type="hidden" id="editRowNumber">

        <!-- שם החנות -->
        <div style="margin-bottom:8px;">

          <label style="font-size:12px;color:#64748b;">
            שם החנות:
          </label>

          <input
            type="text"
            id="editStore"
            style="
              width:100%;
              padding:8px;
              border-radius:6px;
              border:1px solid #cbd5e1;
            "
          >

        </div>

        <!-- שם המוצר -->
        <div style="margin-bottom:8px;">

          <label style="font-size:12px;color:#64748b;">
            שם המוצר:
          </label>

          <input
            type="text"
            id="editProductName"
            style="
              width:100%;
              padding:8px;
              border-radius:6px;
              border:1px solid #cbd5e1;
            "
          >

        </div>

        <!-- מחיר -->
        <div style="margin-bottom:8px;">

          <label style="font-size:12px;color:#64748b;">
            מחיר (₪):
          </label>

          <input
            type="number"
            step="0.01"
            id="editPrice"
            style="
              width:100%;
              padding:8px;
              border-radius:6px;
              border:1px solid #cbd5e1;
            "
          >

        </div>

        <!-- תאריך -->
        <div style="margin-bottom:8px;">

          <label style="font-size:12px;color:#64748b;">
            תאריך:
          </label>

          <input
            type="date"
            id="editDate"
            style="
              width:100%;
              padding:8px;
              border-radius:6px;
              border:1px solid #cbd5e1;
            "
          >

        </div>

        <!-- מחלקה -->
        <div style="margin-bottom:12px;">

          <label style="font-size:12px;color:#64748b;">
            מחלקה:
          </label>

          <!-- המחלקות מתעדכנות אוטומטית מתוך app.js -->
          <select
            id="editCategory"
            style="
              width:100%;
              padding:8px;
              border-radius:6px;
              border:1px solid #cbd5e1;
            "
          ></select>

        </div>

        <!-- כפתורי שמירה וביטול -->
        <div style="display:flex;gap:8px;">

          <button
            type="button"
            onclick="saveEdit()"
            style="
              flex:1;
              padding:8px;
              background:#16a34a;
              color:white;
              border:none;
              border-radius:6px;
              cursor:pointer;
              font-weight:bold;
            "
          >
            שמור שינויים
          </button>

          <button
            type="button"
            onclick="cancelEdit()"
            style="
              padding:8px;
              background:#94a3b8;
              color:white;
              border:none;
              border-radius:6px;
              cursor:pointer;
            "
          >
            ביטול
          </button>

        </div>

      </div>

    </div>

  </div>

  <!-- קוד האתר -->
  <script src="app.js" defer></script>

</body>
</html>
