<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>השוואת מחירי קניות</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>השוואת מחירי קניות</h1>

    <!-- סרגל חיפוש -->
    <div class="search-box">
      <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="🔍 חפש מוצר (למשל: חלב, לחם)...">
    </div>

    <!-- כפתורי העלאת קבלה -->
    <div class="action-buttons">
      <label class="btn btn-camera">
        📷 צלם קבלה
        <input type="file" accept="image/*" capture="environment" onchange="uploadReceipt(event)" hidden>
      </label>
      <label class="btn btn-gallery">
        🖼️ בחר מהגלריה
        <input type="file" accept="image/*" onchange="uploadReceipt(event)" hidden>
      </label>
    </div>

    <div id="uploadStatus" class="status-msg"></div>

    <h2>מוצרים שנמצאו</h2>
    <div id="productsList" class="products-grid">
      <!-- כרטיסי המוצרים ייטענו לכאן -->
    </div>
  </div>

  <!-- Modal היסטוריית מחירים + עריכה ومחיקה -->
  <div id="priceModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h3 id="modalProductName">שם המוצר</h3>
      
      <table class="price-table">
        <thead>
          <tr>
            <th>חנות</th>
            <th>מחיר</th>
            <th>תאריך</th>
            <th>פעולות</th>
          </tr>
        </thead>
        <tbody id="modalPriceTableBody">
          <!-- שורות ההיסטוריה ייטענו לכאן -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
